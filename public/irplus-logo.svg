<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="IR Plus by efin">
  <!-- Dark charcoal background -->
  <rect width="200" height="200" rx="22" fill="#3D3D3D"/>

  <!-- "i" letter: circle head + stem -->
  <circle cx="55" cy="42" r="13" fill="#AACC00"/>
  <rect x="45" y="62" width="20" height="66" rx="5" fill="#AACC00"/>

  <!-- "R" letter -->
  <rect x="82" y="28" width="18" height="100" rx="5" fill="#AACC00"/>
  <!-- R bowl (top arc) -->
  <path d="M100 28 Q148 28 148 56 Q148 84 100 84" stroke="#AACC00" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- R leg (diagonal) -->
  <line x1="108" y1="80" x2="150" y2="128" stroke="#AACC00" stroke-width="18" stroke-linecap="round"/>

  <!-- Separator line -->
  <rect x="20" y="142" width="160" height="2" rx="1" fill="#AACC00" opacity="0.4"/>

  <!-- PLUS -->
  <text x="100" y="168" font-family="'Arial Black', Arial, sans-serif" font-size="28" font-weight="900" fill="#AACC00" text-anchor="middle" letter-spacing="5">PLUS</text>

  <!-- by efin -->
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <tspan fill="#999999">by </tspan><tspan fill="#E85A2B" font-weight="700">efin</tspan>
  </text>
</svg>
